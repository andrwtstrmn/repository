<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>US Equity Daily Briefing</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">

    <!-- Header -->
    <header class="topbar">
      <div class="brand">
        <div class="logo">▲▼</div>
        <div>
          <h1 id="m-title">US Equity Market — Daily Briefing</h1>
          <div class="sub"><span id="m-date"></span> · <span class="status-pill" id="m-status"></span></div>
        </div>
      </div>
      <div class="focus" id="m-focus"></div>
    </header>
    <p class="asof" id="m-asof"></p>

    <!-- Index tiles -->
    <section class="indices" id="indices" aria-label="Headline indices"></section>

    <!-- Macro strip -->
    <section class="macro" id="macro" aria-label="Cross-asset"></section>

    <!-- Two-column main: dashboard left, briefing right -->
    <div class="main">
      <div class="col-left">
        <section class="panel">
          <h2 class="panel-h">Watchlists</h2>
          <div class="groups" id="groups"></div>
        </section>

        <section class="panel">
          <h2 class="panel-h">Today's Movers <span class="muted">(single-session %)</span></h2>
          <div class="movers" id="movers"></div>
        </section>
      </div>

      <div class="col-right">
        <section class="panel briefing">
          <h2 class="panel-h">Written Briefing</h2>
          <p class="headline" id="brief-headline"></p>
          <div id="brief-body"></div>
        </section>
      </div>
    </div>

    <!-- Sources + footer -->
    <section class="panel">
      <h2 class="panel-h">Sources</h2>
      <div class="sources" id="sources"></div>
    </section>

    <footer class="foot">
      <span id="gen-note"></span>
      <span class="disclaimer">For information only — not investment advice. Verify live prices before trading.</span>
    </footer>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
